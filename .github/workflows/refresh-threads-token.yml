name: Refresh Threads Token

# Threads long-lived tokens expire in ~60 days. This refreshes the token monthly
# (well within the window) and writes the new value back to the THREADS_ACCESS_TOKEN
# secret, so social posting to Threads never silently breaks.
#
# No-ops only when Threads is unconfigured. A token WITHOUT THREADS_TOKEN_PAT
# (fine-grained, repo "Secrets: Read and write") now FAILS — see the guard below.

on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh and re-store the Threads token
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.THREADS_TOKEN_PAT }}
        run: |
          if [ -z "$THREADS_ACCESS_TOKEN" ]; then
            echo "THREADS_ACCESS_TOKEN not set — Threads not configured; skipping."
            exit 0
          fi
          # Reaching here means Threads IS configured but cannot self-refresh.
          # Exiting 0 hid exactly that for three green monthly runs while the token died.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::THREADS_TOKEN_PAT is not set, so the refreshed token cannot be"
            echo "::error::written back. THREADS_ACCESS_TOKEN will expire ~60 days after it"
            echo "::error::was issued. Add a fine-grained PAT with repo 'Secrets: Read and"
            echo "::error::write' as THREADS_TOKEN_PAT, or unset THREADS_ACCESS_TOKEN to"
            echo "::error::disable Threads posting entirely."
            exit 1
          fi
          NEW=$(npx tsx scripts/refresh-threads-token.ts)
          if [ -z "$NEW" ]; then
            echo "No new token produced — leaving existing secret unchanged."
            exit 0
          fi
          echo "::add-mask::$NEW"
          gh secret set THREADS_ACCESS_TOKEN --body "$NEW" --repo "${{ github.repository }}"
          echo "THREADS_ACCESS_TOKEN refreshed and updated."
